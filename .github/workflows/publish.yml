name: Publish to PyPI

# 推荐路径一：在 PyPI 上配置 Trusted Publishing（pypi.org -> Your projects ->
# Publishing -> Add a new pending publisher，填本仓库与 workflow 名 publish.yml），
# 之后本 workflow 无需任何 token 即可发布。
# 触发方式：打 tag 并发布 Release，或在 Actions 页面手动运行。

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install --upgrade twine && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
